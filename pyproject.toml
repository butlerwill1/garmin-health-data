[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-daylio-analysis"
version = "0.1.0"
description = "Private, reproducible association analysis for Garmin and Daylio exports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jupyterlab>=4.2",
  "matplotlib>=3.8",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "seaborn>=0.13",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
  "nbstripout>=0.7",
  "pre-commit>=3.7",
  "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
